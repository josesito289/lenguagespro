<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta de Inglés</title>

<meta name="description" content="Seguimiento diario de tu plan de inglés de 4 meses.">
<meta name="theme-color" content="#2F5D50">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ruta Inglés">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="brand"><h1 style="font-family:var(--font-serif);">Ruta de Inglés</h1><span class="mark">4 meses</span></div>
    <div class="meta" id="headerMeta">Cargando…</div>
  </header>
  <main class="view" id="view"></main>
  <nav class="bottom-nav" id="bottomNav"></nav>
  <div class="toast" id="toast"></div>
</div>

<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {
        // offline caching is a bonus, not a requirement — the app still
        // works normally if the service worker can't be registered
      });
    });
  }
</script>
</body>
</html>
